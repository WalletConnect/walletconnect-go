name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TEST_PROJECT_ID: ${{ secrets.TEST_PROJECT_ID }}
  TEST_RELAY_URL: wss://relay.walletconnect.com
  # Live tests fail in CI without TEST_PROJECT_ID, so a lost secret cannot
  # pass silently. Pull requests from forks and Dependabot get no repository
  # secrets; only they may skip.
  TEST_ALLOW_SKIP_LIVE: ${{ (github.event.pull_request.head.repo.fork || github.actor == 'dependabot[bot]') && '1' || '' }}
  STATICCHECK: honnef.co/go/tools/cmd/staticcheck@v0.8.2

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "$unformatted"; exit 1; fi
      - name: go.mod is tidy
        run: go mod tidy && git diff --exit-code go.mod go.sum
      - run: go vet ./...
      - run: go vet -tags interop ./interop/
      - run: go run $STATICCHECK ./...

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: unit and live relay tests
        run: go test -race -count=1 ./...
      - name: report skipped live tests
        if: env.TEST_ALLOW_SKIP_LIVE == '1'
        run: |
          echo "Live relay tests were skipped: this run has no access to TEST_PROJECT_ID." >> "$GITHUB_STEP_SUMMARY"

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: examples/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: examples/web/go.mod
          cache-dependency-path: examples/web/go.sum
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "$unformatted"; exit 1; fi
      - name: go.mod is tidy
        run: go mod tidy && git diff --exit-code go.mod go.sum
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./...

  interop:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: interop/js/package-lock.json
      - run: npm ci
        working-directory: interop/js
      - name: golden vectors match the JS SDK
        working-directory: interop/js
        run: node gen-vectors.mjs && git diff --exit-code ../../testdata/vectors.json
      - name: Go and JS SDK interop
        run: go test -race -count=1 -tags interop ./interop/
      - name: report skipped interop tests
        if: env.TEST_ALLOW_SKIP_LIVE == '1'
        run: |
          echo "Interop tests were skipped: this run has no access to TEST_PROJECT_ID." >> "$GITHUB_STEP_SUMMARY"
